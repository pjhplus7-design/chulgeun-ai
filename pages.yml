# 기사가 바뀌면 사이트를 다시 만들어 GitHub Pages에 게시합니다.
# 저장소 Settings > Pages > Build and deployment > Source 를 "GitHub Actions"로 바꿔 두세요.
name: build-site

on:
  push:
    branches: [main]
    paths: ["content/**", "drafts/**", "site.json", "assets/**", "build_site.py"]
  workflow_run:
    workflows: ["daily-briefing"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
