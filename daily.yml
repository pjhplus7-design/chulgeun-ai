# 매일 오전 6시(한국 시간)에 뉴스를 모으고 초안을 만들어 저장소에 커밋합니다.
# 저장소 Settings > Secrets and variables > Actions 에 ANTHROPIC_API_KEY 를 등록하세요.
# 워드프레스 자동 업로드를 쓰려면 WP_URL, WP_USER, WP_APP_PASSWORD 도 등록하세요(없으면 건너뜁니다).
name: daily-briefing

on:
  schedule:
    - cron: "0 21 * * *"   # UTC 21:00 = 한국 06:00
  workflow_dispatch: {}      # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      WP_URL: ${{ secrets.WP_URL }}
      WP_USER: ${{ secrets.WP_USER }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 뉴스 수집
        run: python collect.py
      - name: AI 초안 작성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python draft.py --count 5
      - name: 워드프레스 임시글 등록 (설정한 경우만)
        if: ${{ env.WP_URL != '' }}
        run: python publish_wp.py
      - name: 결과 저장
        run: |
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add data drafts
          git diff --cached --quiet || git commit -m "초안 $(TZ=Asia/Seoul date +%F)"
          git push
